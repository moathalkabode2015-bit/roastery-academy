  <style>
    :root {
      --bg-page: #f7f4ef;
      --bg-card: #ffffff;
      --bg-soft: #efe9df;
      --ink-main: #1d1612;
      --ink-muted: #66584f;
      --accent: #7c4a27;
      --accent-dark: #573117;
      --gold: #c49a5a;
      --border: #e4dcd0;
      --success: #1f7a4c;
      --lock: #8a3b2b;
      --shadow: 0 8px 24px rgba(29, 22, 18, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-main);
      line-height: 1.65;
      padding-bottom: 64px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button, input, select, textarea {
      font-family: 'Tajawal', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* شريط الإعلانات العلوي */
    .announcement-bar {
      background: var(--ink-main);
      color: #fff8ee;
      font-size: 13px;
      padding: 9px 14px;
      text-align: center;
    }

    .announcement-bar strong {
      color: #f3cf93;
    }

    .announcement-bar button {
      background: var(--gold);
      color: var(--ink-main);
      border: none;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
    }

    /* الهيدر */
    .site-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 12px rgba(29, 22, 18, 0.04);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 70px;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--ink-main);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn:hover {
      background: #e5dccd;
    }

    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--ink-main));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      border: 2px solid var(--gold);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-main);
      margin-top: 2px;
    }

    .status-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .status-pill.locked {
      background: #fdeceb;
      color: var(--lock);
      border-color: #f4c7c2;
    }

    .status-pill.active {
      background: #e7f6ee;
      color: var(--success);
      border-color: #b7e4cb;
    }

    /* البحث */
    .search-box {
      position: relative;
      padding: 0 0 12px;
    }

    .search-input {
      width: 100%;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-page);
      font-size: 14px;
    }

    .search-results {
      position: absolute;
      top: calc(100% - 8px);
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      z-index: 50;
      max-height: 280px;
      overflow-y: auto;
      display: none;
    }

    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background: var(--bg-soft);
    }
